name: Apply Playable Homepage Preview

on:
  push:
    paths:
      - '.github/workflows/apply-playable-preview.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mount interactive preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/HomePage.tsx')
          text = p.read_text()
          import_line = "import { HomeCinematicSequence, HomeExperienceFx, HomeIntro } from '@/components/HomeExperience'"
          preview_import = "import HomePlayablePreview from '@/components/HomePlayablePreview'"
          if preview_import not in text:
              text = text.replace(import_line, import_line + '\n' + preview_import)
          marker = "      <HomeCinematicSequence />\n\n      <div className=\"dino-marquee-wrap"
          replacement = "      <HomeCinematicSequence />\n      <HomePlayablePreview />\n\n      <div className=\"dino-marquee-wrap"
          if '<HomePlayablePreview />' not in text:
              if marker not in text:
                  raise SystemExit('Homepage insertion marker not found')
              text = text.replace(marker, replacement, 1)
          p.write_text(text)
          PY

      - name: Verify build
        env:
          VITE_BASE_PATH: /dino-warfront-test/
        run: |
          npm ci
          npm run build

      - name: Commit preview
        run: |
          rm -f .github/workflows/apply-playable-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show interactive world map and march builder'
          git push origin HEAD:main
