name: Reapply Homepage Experiments

on:
  push:
    paths:
      - '.github/workflows/reapply-home-experiments.yml'

permissions:
  contents: write

jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current test baseline
        uses: actions/checkout@v4
        with:
          path: current
          fetch-depth: 0

      - name: Checkout previously tested experiment
        uses: actions/checkout@v4
        with:
          ref: 1a38b2970482dcc176ac1977378e5c8326ef481e
          path: experiment

      - name: Reapply experimental homepage files
        shell: bash
        run: |
          set -euo pipefail
          cp experiment/src/components/HomeModesNetworkPortal.tsx current/src/components/HomeModesNetworkPortal.tsx
          cp experiment/src/components/HomeDinoRoster.tsx current/src/components/HomeDinoRoster.tsx
          cp experiment/src/components/HomeSoundToggle.tsx current/src/components/HomeSoundToggle.tsx
          cp experiment/src/pages/HomeExperienceUpgrade.css current/src/pages/HomeExperienceUpgrade.css
          cp experiment/src/pages/HomePage.tsx current/src/pages/HomePage.tsx
          cp experiment/src/sections/Navigation.tsx current/src/sections/Navigation.tsx
          cp experiment/src/sections/WarRoom.tsx current/src/sections/WarRoom.tsx
          cp experiment/src/main.tsx current/src/main.tsx

          # Keep the verified production Partner artwork introduced after the experiment.
          sed -i 's#promo/partner-system-promo.jpg#promo/partner-system-promo.webp#g' current/src/components/HomeModesNetworkPortal.tsx

          # Six Ways is native inside HomePage now, so remove the production-era global portal mount.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('current/src/App.tsx')
          s = p.read_text()
          s = s.replace("import HomeModesNetworkPortal from '@/components/HomeModesNetworkPortal'\n", '')
          s = s.replace('      <HomeModesNetworkPortal />\n', '')
          p.write_text(s)
          PY

      - name: Verify test build
        working-directory: current
        env:
          VITE_BASE_PATH: /dino-warfront-test/
        run: |
          npm ci
          npm run build

      - name: Commit experimental homepage
        working-directory: current
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/reapply-home-experiments.yml
          git add -A
          git commit -m "Reapply homepage experiments on production baseline"
          git push origin HEAD:main
