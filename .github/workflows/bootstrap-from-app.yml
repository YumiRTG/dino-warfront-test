name: Bootstrap test repository from app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-from-app.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: YumiRTG/app
          ref: main
          path: _source
          fetch-depth: 1
          lfs: true

      - name: Stage source snapshot outside working tree
        shell: bash
        run: |
          rm -rf /tmp/dino-source
          mkdir -p /tmp/dino-source
          rsync -a --exclude='.git/' --exclude='.github/' _source/ /tmp/dino-source/

      - name: Replace test contents with source snapshot
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a /tmp/dino-source/ ./

      - name: Commit synchronized snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Sync test baseline from YumiRTG/app'
            git push origin HEAD:main
          fi
