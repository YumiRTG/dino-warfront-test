name: Deploy Test Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the public test snapshot without turning every visitor into a Firestore reader.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dino-warfront-test-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh cached public game snapshot
        shell: bash
        run: |
          mkdir -p public
          if curl --fail --silent --show-error --location \
            'https://app-dino-dominion.vercel.app/api/live' \
            --output public/live-snapshot.json; then
            echo 'Live snapshot refreshed from the production edge cache.'
          else
            echo 'Live snapshot request failed; publishing a safe empty snapshot.'
            printf '%s\n' '{"generatedAt":0,"pulse":{"commanders":0,"alliances":0,"troopKills":0,"topPower":0,"lastSeenMinutes":null},"ranks":{},"arena":[],"teamArena":[],"alliances":[]}' > public/live-snapshot.json
          fi

      - name: Build GitHub Pages preview
        run: npm run build
        env:
          VITE_BASE_PATH: /dino-warfront-test/
          VITE_LIVE_SNAPSHOT_URL: /dino-warfront-test/live-snapshot.json

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
