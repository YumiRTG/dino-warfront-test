name: Deploy Test Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dino-warfront-test-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate lightweight WebP assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          public = Path('public')
          output = public / 'optimized'
          output.mkdir(parents=True, exist_ok=True)

          files = [
              'banner-bg.png',
              'dino-tyranno.png',
              'dino-raptor.png',
              'dino-triceratops.png',
              'dino-dilo.png',
              'dino-stego.png',
              'dino-allo.png',
              'dino-ptera.png',
              'dino-dragon.png',
          ]

          total_before = 0
          total_after = 0

          for name in files:
              src = public / name
              if not src.exists():
                  raise SystemExit(f'Missing source image: {src}')

              is_background = name == 'banner-bg.png'
              max_side = 1600 if is_background else 1200
              quality = 82 if is_background else 86
              dst = output / f'{src.stem}.webp'

              with Image.open(src) as im:
                  im.load()
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA' if 'transparency' in im.info else 'RGB')
                  im.thumbnail((max_side, max_side), Image.Resampling.LANCZOS)
                  im.save(dst, 'WEBP', quality=quality, method=5)

              before = src.stat().st_size
              after = dst.stat().st_size
              total_before += before
              total_after += after
              print(f'{name}: {before / 1024:.0f} KB -> {after / 1024:.0f} KB')

          saving = 100 * (1 - total_after / total_before) if total_before else 0
          print(f'Homepage image trial: {total_before / 1024 / 1024:.1f} MB -> {total_after / 1024 / 1024:.1f} MB ({saving:.1f}% smaller)')
          PY

      - name: Refresh cached public game snapshot
        shell: bash
        run: |
          mkdir -p public
          if curl --fail --silent --show-error --location \
            'https://app-dino-dominion.vercel.app/api/live' \
            --output public/live-snapshot.json; then
            echo 'Live snapshot refreshed from the production edge cache.'
          else
            echo 'Live snapshot request failed; publishing a safe empty snapshot.'
            printf '%s\n' '{"generatedAt":0,"pulse":{"commanders":0,"alliances":0,"troopKills":0,"topPower":0,"lastSeenMinutes":null},"ranks":{},"arena":[],"teamArena":[],"alliances":[]}' > public/live-snapshot.json
          fi

      - name: Build GitHub Pages preview
        run: npm run build
        env:
          VITE_BASE_PATH: /dino-warfront-test/
          VITE_LIVE_SNAPSHOT_URL: /dino-warfront-test/live-snapshot.json
          VITE_USE_OPTIMIZED_ASSETS: '1'

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
