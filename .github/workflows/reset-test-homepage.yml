name: Reset Test Homepage Experience

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reset-test-homepage.yml'

permissions:
  contents: write

jobs:
  reset-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync production baseline and add experience
        run: python scripts/sync_test_home_experience.py

      - name: Commit homepage
        shell: bash
        run: |
          if git diff --quiet -- src/pages/HomePage.tsx; then
            echo 'Homepage already matches the generated experience version.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/HomePage.tsx
          git commit -m 'Reset test homepage and add cinematic experience'
          git push
